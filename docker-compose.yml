services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nqmate
      POSTGRES_USER: nqmate
      POSTGRES_PASSWORD: nqmate_local
    ports:
      - "5432:5432"
    volumes:
      - nqmate-postgres:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/nqmate_local
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - nqmate-neo4j:/data

volumes:
  nqmate-postgres:
  nqmate-neo4j:
