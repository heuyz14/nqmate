[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nqmate-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "neo4j>=5.27,<6",
  "supabase>=2.11,<3",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]
ml = ["xgboost>=2.1,<4", "scikit-learn>=1.5,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
